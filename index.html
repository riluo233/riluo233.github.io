<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>⚡ AI工作台 · 锋刃v6.1</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--c:#00f0ff;--p:#ff00e5;--g:#39ff14;--y:#ffe600;--bg:#03040a;--panel:rgba(8,12,32,.88);--panel2:rgba(14,20,48,.92);--line:rgba(0,240,255,.28);--txt:#e8f6ff;--dim:#8fa3bf;--gc:0 0 8px rgba(0,240,255,.55),0 0 24px rgba(0,240,255,.22);--gp:0 0 8px rgba(255,0,229,.55),0 0 24px rgba(255,0,229,.22)}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;font-size:15px;line-height:1.65;overflow:hidden}
.bg-grid{position:fixed;inset:-30% -30%;z-index:-3;pointer-events:none;background:linear-gradient(rgba(0,240,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.07) 1px,transparent 1px),linear-gradient(rgba(255,0,229,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,0,229,.05) 1px,transparent 1px);background-size:48px 48px,48px 48px,240px 240px,240px 240px;animation:gridMove 26s linear infinite;opacity:.85}
@keyframes gridMove{0%{transform:translate3d(0,0,0)}100%{transform:translate3d(48px,48px,0)}}
.orb{position:fixed;border-radius:50%;z-index:-2;pointer-events:none}
.orb.o1{width:46vmax;height:46vmax;left:-12vmax;top:-10vmax;background:radial-gradient(circle,rgba(0,240,255,.45),transparent 70%);animation:orb1 18s ease-in-out infinite alternate}
.orb.o2{width:40vmax;height:40vmax;right:-10vmax;bottom:-12vmax;background:radial-gradient(circle,rgba(255,0,229,.4),transparent 70%);animation:orb2 22s ease-in-out infinite alternate}
.orb.o3{width:30vmax;height:30vmax;left:28%;top:38%;background:radial-gradient(circle,rgba(57,255,20,.16),transparent 70%);animation:orb3 26s ease-in-out infinite alternate}
@keyframes orb1{to{transform:translate3d(8vmax,6vmax,0) scale(1.15)}}
@keyframes orb2{to{transform:translate3d(-7vmax,-8vmax,0) scale(1.1)}}
@keyframes orb3{to{transform:translate3d(-6vmax,10vmax,0)}}
body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.6) 100%)}
.bg-scan{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.045;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(255,255,255,.6) 2px 3px);animation:scanFlick 8s steps(1) infinite}
@keyframes scanFlick{0%,91%{opacity:.045}93%{opacity:.08}94%{opacity:.02}96%{opacity:.06}100%{opacity:.045}}
header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:5px;padding:8px 10px;background:rgba(6,9,26,.85);border-bottom:1px solid var(--line);flex-wrap:wrap}
header::after{content:'';position:absolute;left:0;right:0;bottom:-2px;height:2px;background:linear-gradient(90deg,transparent,var(--c),var(--p),var(--g),transparent);background-size:200% 100%;animation:lineFlow 5s linear infinite}
@keyframes lineFlow{to{background-position:200% 0}}
header h1{font-size:16px;white-space:nowrap;margin-right:auto;font-weight:800;background:linear-gradient(90deg,var(--c),var(--p),var(--c));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 8px rgba(0,240,255,.7));animation:gradSlide 6s linear infinite}
@keyframes gradSlide{to{background-position:200% 0}}
header select,header button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:12px}
header button:active{transform:scale(.94)}
.tog{position:relative}
.tog.on{box-shadow:var(--gc);border-color:var(--c);color:var(--c)}
.tog.on::after{content:'';position:absolute;left:8px;right:8px;bottom:2px;height:2px;background:var(--c);box-shadow:var(--gc);border-radius:2px}
.view{position:fixed;top:46px;left:0;right:0;bottom:0;display:none}
#viewWork{display:block}
#chatBox{position:absolute;top:0;left:0;right:0;bottom:66px;overflow-y:auto;padding:12px 12px 20px;-webkit-overflow-scrolling:touch}
.msg{margin:10px 0;padding:10px 13px;border-radius:14px;max-width:100%;word-break:break-word;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.msg.user{background:linear-gradient(135deg,rgba(0,240,255,.22),rgba(0,240,255,.06));border:1px solid rgba(0,240,255,.4);margin-left:auto;width:fit-content;max-width:88%;box-shadow:0 0 14px rgba(0,240,255,.14)}
.msg.ai{background:linear-gradient(135deg,rgba(255,0,229,.12),rgba(255,0,229,.04));border:1px solid rgba(255,0,229,.32);box-shadow:0 0 14px rgba(255,0,229,.1)}
.typing::after{content:'▌';color:var(--g);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.out-item{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;content-visibility:auto;contain-intrinsic-size:auto 260px}
.out-item::before{content:'';position:absolute;top:-1px;left:-1px;width:18px;height:18px;border-top:2px solid var(--c);border-left:2px solid var(--c);border-radius:12px 0 0 0}
.out-item::after{content:'';position:absolute;bottom:-1px;right:-1px;width:18px;height:18px;border-bottom:2px solid var(--p);border-right:2px solid var(--p);border-radius:0 0 12px 0}
.out-item img{max-width:100%;border-radius:8px}
pre.code{font-family:Consolas,monospace;font-size:12px;color:var(--g);background:rgba(0,0,0,.5);border:1px solid rgba(57,255,20,.3);border-radius:8px;padding:8px;overflow-x:auto;white-space:pre-wrap;text-shadow:0 0 6px rgba(57,255,20,.4)}
table.tbl{border-collapse:collapse;width:100%;font-size:12px;background:#0a0e23}
table.tbl th,table.tbl td{border:1px solid rgba(0,240,255,.25);padding:5px 8px}
table.tbl th{background:rgba(0,240,255,.15)}
button{position:relative;background:linear-gradient(135deg,rgba(0,240,255,.18),rgba(255,0,229,.18));color:var(--txt);border:1px solid rgba(0,240,255,.35);border-radius:9px;padding:7px 11px;font-size:13px;transition:transform .12s,box-shadow .2s}
button:active{transform:scale(.95)}
button:hover{box-shadow:var(--gc)}
button.pri{overflow:hidden;background:linear-gradient(135deg,var(--c),var(--p));color:#000;font-weight:700;border:none;box-shadow:0 0 14px rgba(0,240,255,.4)}
button.pri::after{content:'';position:absolute;top:0;left:-60%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:sheen 3.2s ease-in-out infinite}
@keyframes sheen{0%{left:-60%}60%,100%{left:140%}}
.inputbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:flex-end;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:rgba(6,9,26,.85);border-top:1px solid var(--line)}
.inputbar textarea{flex:1;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:15px;resize:none;height:42px;max-height:110px;outline:none}
.inputbar textarea:focus{border-color:var(--c);box-shadow:var(--gc)}
#viewFoot{overflow-y:auto;padding:12px 12px 30px;-webkit-overflow-scrolling:touch}
#tplFab{position:fixed;bottom:74px;right:12px;z-index:60}
#tplFab button{border-radius:22px;padding:10px 14px;font-size:15px;font-weight:700;background:linear-gradient(135deg,var(--c),var(--p));color:#000;border:none;animation:fabPulse 2.6s ease-in-out infinite}
@keyframes fabPulse{0%,100%{box-shadow:var(--gc)}50%{box-shadow:var(--gp)}}
#tplPanel{position:fixed;right:12px;bottom:118px;z-index:61;width:212px;max-height:58vh;overflow-y:auto;background:rgba(8,12,32,.96);border:1px solid var(--c);border-radius:12px;padding:8px;box-shadow:var(--gp);display:none}
#tplPanel button{display:block;width:100%;margin:4px 0;text-align:left;font-size:13px}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:linear-gradient(var(--c),var(--p));border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

</div>
</div>

<div style="display:flex;gap:8px;margin:8px 0">

</div>

window.addEventListener('error',function(e){var d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:999999;background:#300;color:#ff6;font-size:12px;padding:8px;white-space:pre-wrap';d.textContent='❌ '+e.message+'（行'+e.lineno+'）';document.body.appendChild(d)});
</script>
<script>
const API_URL='https://api.deepseek.com/chat/completions';
let API_KEY=localStorage.getItem('wt_api')||'';
let TAVILY_KEY=localStorage.getItem('wt_tavily')||'';
let MODEL=localStorage.getItem('wt_model')||'deepseek-chat';
let AUTO_EXEC=false;
let HISTORY=[],PROFILE=localStorage.getItem('wt_profile')||'',SUMMARY=localStorage.getItem('wt_summary')||'';
function $(id){return document.getElementById(id)}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function scrollBox(){$('chatBox').scrollTop=$('chatBox').scrollHeight}
function addMsg(role,text){const box=document.createElement('div');box.className='msg '+role;const t=document.createElement('div');t.textContent=text;box.appendChild(t);$('chatBox').appendChild(box);scrollBox();return box}
function downloadFile(n,c,m){const b=new Blob([c],{type:m||'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},200)}
function saveDataUrl(n,d){const a=document.createElement('a');a.href=d;a.download=n;a.click()}
function switchTab(name){
 $('viewWork').style.display=name==='work'?'block':'none';
 $('viewFoot').style.display=name==='foot'?'block':'none';
 $('tabWork').classList.toggle('on',name==='work');
 $('tabFoot').classList.toggle('on',name==='foot');
}
function ck(el){el.textContent=el.textContent==='☐'?'✅':'☐'}
function tk(el){el.style.textDecoration=el.style.textDecoration==='line-through'?'none':'line-through'}
function savePNG(btn){const img=btn.parentElement.querySelector('img');if(img)saveDataUrl('图_'+Date.now()+'.png',img.src)}
function cardHTML(){
 let h=`<div style="max-width:420px;margin:0 auto;font-family:'PingFang SC',sans-serif;background:linear-gradient(160deg,#f0fbff,#e8f7ff);border-radius:24px;padding:16px;box-shadow:0 8px 30px rgba(0,180,255,.25)"><div style="text-align:center;font-size:19px;font-weight:bold;color:#0090e8">📊 运动打卡（点☐打勾）</div><table style="width:100%;border-collapse:collapse;margin-top:10px;font-size:12px;text-align:center"><tr style="background:#0090e8;color:#fff"><th style="padding:5px">天</th><th>快走</th><th>跳绳</th><th>拉伸</th><th>燃脂</th></tr>`;
 for(let i=1;i<=14;i++){
  h+=`<tr><td style="padding:4px;border:1px solid #cce9ff;background:#fff">第${i}天</td>`;
  for(let j=0;j<4;j++){
   h+=`<td style="padding:4px;border:1px solid #cce9ff;background:#fff;font-size:15px;cursor:pointer" onclick="ck(this)">☐</td>`;
  }
  h+='</tr>';
 }
 return h+'</table></div>';
}
const TPL_FLOW={

  html:`<div style="max-width:420px;margin:0 auto;font-family:'PingFang SC',sans-serif;background:linear-gradient(160deg,#fff5f7,#fff0f5);border-radius:24px;padding:22px;box-shadow:0 8px 30px rgba(255,105,180,.25)"><div style="text-align:center;font-size:21px;font-weight:bold;color:#ff4d94">🍎 减肥计划 · 目标{target}</div><div style="background:linear-gradient(135deg,#ff9a9e,#ff4d94);border-radius:16px;padding:13px;color:#fff;margin:10px 0">🚀 <b>{p1}</b><br><span style="font-size:13px">戒奶茶宵夜 · 晚餐7分饱</span></div><div style="background:linear-gradient(135deg,#ffb199,#ff6b6b);border-radius:16px;padding:13px;color:#fff;margin:10px 0">⚡ <b>{p2}</b><br><span style="font-size:13px">早餐加蛋白 · 跳绳15分钟</span></div><div style="background:linear-gradient(135deg,#f6d365,#fda085);border-radius:16px;padding:13px;color:#fff;margin:10px 0">🔥 <b>{p3}</b><br><span style="font-size:13px">16+8轻断食 · 喝水2L</span></div><div style="background:linear-gradient(135deg,#84fab0,#4ecdc4);border-radius:16px;padding:13px;color:#fff;margin:10px 0">🏆 <b>{p4}</b><br><span style="font-size:13px">恢复三餐 · 保持运动</span></div><div style="text-align:center;font-size:15px;font-weight:bold;color:#ff4d94;margin-top:12px">✅ 达成 {target}</div></div>`},
 flow_football:{mode:'mermaid',mermaid:`graph TD

 E --> F["📊输出结果"]`},
 flow_decision:{mode:'mermaid',mermaid:`graph TD

 B -->|是| C["✅执行"]

 week_plan:{mode:'mermaid',mermaid:`graph TD

 food_plan:{mode:'html',html:`<div style="max-width:420px;margin:0 auto;font-family:'PingFang SC',sans-serif;background:linear-gradient(160deg,#fff7f2,#fff0e6);border-radius:24px;padding:18px;box-shadow:0 8px 30px rgba(255,165,80,.25)"><div style="text-align:center;font-size:20px;font-weight:bold;color:#ff7a3d">🍱 一周食谱表</div><table style="width:100%;border-collapse:collapse;margin-top:10px;font-size:12px"><tr style="background:#ff7a3d;color:#fff"><th style="padding:7px">餐次</th><th>周一~三</th><th>周四~日</th></tr><tr><td style="padding:7px;background:#fff;border:1px solid #ffe0cc;font-weight:bold">🌅早</td><td style="padding:7px;background:#fff;border:1px solid #ffe0cc">鸡蛋+牛奶+全麦</td><td style="padding:7px;background:#fff;border:1px solid #ffe0cc">燕麦+酸奶+水果</td></tr><tr><td style="padding:7px;background:#fffaf5;border:1px solid #ffe0cc;font-weight:bold">☀️午</td><td style="padding:7px;background:#fffaf5;border:1px solid #ffe0cc">鸡胸+糙米+西兰花</td><td style="padding:7px;background:#fffaf5;border:1px solid #ffe0cc">牛肉+荞麦面+沙拉</td></tr><tr><td style="padding:7px;background:#fff;border:1px solid #ffe0cc;font-weight:bold">🌙晚</td><td style="padding:7px;background:#fff;border:1px solid #ffe0cc">虾仁+蔬菜汤7分饱</td><td style="padding:7px;background:#fff;border:1px solid #ffe0cc">豆腐+菌菇+青菜</td></tr></table><div style="text-align:center;font-size:11px;color:#c98;margin-top:8px">🥗少油少盐·多喝水</div></div>`},

第13天,,,
第14天,118.0,,🎉达成`},
 football_card:{mode:'html',html:`<div style="max-width:420px;margin:0 auto;font-family:'PingFang SC',sans-serif;background:linear-gradient(160deg,#0d0f2a,#1a1a4a);border-radius:24px;padding:20px;box-shadow:0 8px 30px rgba(0,240,255,.3);color:#fff"><div style="text-align:center;font-size:20px;font-weight:bold;color:#00f0ff;text-shadow:0 0 12px rgba(0,240,255,.6)">⚽ 锋刃v6.1 推演结果</div><div style="text-align:center;font-size:15px;margin:8px 0 12px">{home} <span style="color:#ff00e5">VS</span> {away}</div><div style="font-size:12px;color:#8fa3bf;margin-bottom:6px">🎲 S3v3 五比分</div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center"><span style="background:rgba(0,240,255,.15);border:1px solid #00f0ff;border-radius:10px;padding:6px 10px;font-size:14px">{s1}</span><span style="background:rgba(0,240,255,.15);border:1px solid #00f0ff;border-radius:10px;padding:6px 10px;font-size:14px">{s2}</span><span style="background:rgba(0,240,255,.15);border:1px solid #00f0ff;border-radius:10px;padding:6px 10px;font-size:14px">{s3}</span><span style="background:rgba(0,240,255,.15);border:1px solid #00f0ff;border-radius:10px;padding:6px 10px;font-size:14px">{s4}</span><span style="background:rgba(0,240,255,.15);border:1px solid #00f0ff;border-radius:10px;padding:6px 10px;font-size:14px">{s5}</span></div><div style="margin-top:12px;background:linear-gradient(135deg,#00f0ff,#ff00e5);border-radius:12px;padding:10px;text-align:center;font-weight:bold;color:#000">🎯 方向：{rec}</div><div style="font-size:11px;color:#8fa3bf;text-align:center;margin-top:10px">R1-R12 · 六维场景 · 仅供参考</div></div>`},

function fillTpl(t,p){var out=t;for(var k in p){out=out.split('{'+k+'}').join(p[k])}return out}
let _TPL_QUEUE=[];
function renderTplCall(text){
 const re=/___TPL___:([a-z0-9_]+)(?:\|([^___]*))?/g;_TPL_QUEUE=[];let hit=false;

let CODES=[];
function extractCodeBlocks(text){
 CODES=[];
 var out='',rest=text,start;
 while((start=rest.indexOf('```python'))!==-1){
  out+=rest.slice(0,start);
  rest=rest.slice(start+9);
  var end=rest.indexOf('```');
  if(end===-1){out+=rest;rest='';break}
  CODES.push(rest.slice(0,end));
  out+='[[CODE:'+(CODES.length-1)+']]';
  rest=rest.slice(end+3);
 }
 return out+rest;
}
function splitMarkers(text){
 var parts=[],cur='',rest=text;
 var names=['___HTML___','___TABLE___','___MERMAID___','___IMG___'];
 while(true){
  var pos=-1,which=-1,i;
  for(i=0;i<names.length;i++){
   var p=rest.indexOf(names[i]);
   if(p!==-1&&(pos===-1||p<pos)){pos=p;which=i}
  }
  if(pos===-1)break;
  cur+=rest.slice(0,pos);
  if(cur.trim()){parts.push({type:'text',content:cur});cur=''}
  var after=rest.slice(pos+names[which].length);
  if(after.charCodeAt(0)===10)after=after.slice(1);
  var end=-1,j;
  for(j=0;j<names.length;j++){
   var q=after.indexOf(names[j]);
   if(q!==-1&&(end===-1||q<end))end=q;
  }
  var content=(end===-1)?after:after.slice(0,end);
  parts.push({type:names[which].slice(3,-3).toLowerCase(),content:content});
  rest=(end===-1)?'':after.slice(end);
 }
 if(rest.trim())parts.push({type:'text',content:rest});
 return parts;
}
function renderText(content){

 var out='',rest=t,start;
 while((start=rest.indexOf('[[CODE:'))!==-1){
  out+=rest.slice(0,start);

  var e=rest.indexOf(']]');
  if(e===-1){out+='[[CODE:';break}
  var idx=+rest.slice(0,e);
  var code=CODES[idx]||'';
  out+='<div class="out-item"><div style="font-size:11px;color:#8fa3bf;margin-bottom:4px">🐍 Python</div><pre class="code">'+escapeHtml(code.length>400?code.slice(0,400)+'…':code)+'</pre><button data-run="'+idx+'" style="margin-top:6px">▶运行</button><span class="runStatus" style="font-size:12px;color:#8fa3bf;margin-left:8px"></span></div>';
  rest=rest.slice(e+2);
 }
 out+=rest;
 return out.split(String.fromCharCode(10)).join('<br>');
}

  r.actual={dir:mm.dir,h:mm.h,a:mm.a,btts:mm.btts};
  var it={md:r.md,pred:r.pred,act:{h:mm.h,a:mm.a,dir:mm.dir,btts:mm.btts}};
  it.md.league_count=(window.FOOT_STATE.leagues[r.md.league||'英超']||{count:0}).count+1;
  items.push(it);
 }
 if(!items.length){out.textContent='❌ 行格式应为: 2-1 主 Yes';return}
 try{
  const py=await getPyodide();
  py.runPython(ENGINE_PY);
  if(window.FOOT_STATE.t_base)py.runPython('T_BASE='+window.FOOT_STATE.t_base);
  if(window.FOOT_STATE.proto){py.globals.set('__pr',window.FOOT_STATE.proto);py.runPython('PROTO={k:(__pr[k][0],__pr[k][1]) for k in __pr}')}
  if(window.FOOT_STATE.w){py.globals.set('__w',window.FOOT_STATE.w);py.runPython('W=list(__w)')}
  py.globals.set('__items',items);
  py.runPython(`
def __bulk_cal(items):
 logs=[]
 for it in items:
  b=BladeV60(it['md'])
  b.last={'dir':it['pred']['dir'],'s1':float(it['pred']['s1']),'btts':it['pred']['btts'] or 'Yes（倾向）','score':list(it['pred']['score']) or [1,0],'fin':float(it['pred']['fin'])}
  act={'dir':it['act']['dir'],'s1':it['act']['h']+it['act']['a'],'btts':it['act']['btts'],'score':[it['act']['h'],it['act']['a']]}
  logs.append(b.calibrate(act))
 return logs, b.state
__logs,__bst=__bulk_cal(__items)`);
  const logs=py.globals.get('__logs').toJs();
  const st=py.globals.get('__bst').toJs();
  window.FOOT_STATE.samples+=items.length;
  window.FOOT_STATE.t_base=st.T_base;
  window.FOOT_STATE.calibration=st.cal;
  window.FOOT_STATE.proto=st.proto;
  window.FOOT_STATE.w=st.w;
  items.forEach(function(it){const Lx=window.FOOT_STATE.leagues[it.md.league||'英超']||{count:0,L:null,hits:0,confSum:0,ratio:0.9};Lx.count++;window.FOOT_STATE.leagues[it.md.league||'英超']=Lx});
  saveFS();
  out.textContent=logs.join(String.fromCharCode(10))+String.fromCharCode(10)+'📊 批量完成: +'+items.length+'场 | 总样本'+window.FOOT_STATE.samples+' | T_base='+st.T_base.toFixed(4);
 }catch(e){out.textContent='❌ '+escapeHtml(e.message||String(e))}
}

function showJudge(){

 Object.keys(j.buckets||{}).forEach(k=>{const b=j.buckets[k];const rate=b.n?b.hit/b.n:0;lines.push(' 置信度'+k+': '+b.n+'场 命中率'+Math.round(rate*100)+'%');if(b.n>=3){total+=Math.abs(rate-(parseInt(k)/100));n++}});
 lines.push(' 校准偏差: '+(n?((total/n)*100).toFixed(1)+'%':'数据不足')+(n&&(total/n)>0.08?' ⚠️需重校准':''));

async function dailyEvolve(){
 const out=$('evolOut');
 const today=new Date().toLocaleDateString();
 if(window.FOOT_STATE.lastEvolve===today){out.textContent='📅 今日已升级，无需重复操作';return}
 out.textContent='🔄 每日自动升级中…';
 showJudge();
 const rs=window.FOOT_STATE.results||[];
 let mh=0,lh=0,tt=0;
 rs.forEach(r=>{if(r.actual){tt++;if(r.pred&&r.pred.dir===r.actual.dir)mh++;if(r.legacy&&r.legacy.dir===r.actual.dir)lh++}});
 const lines2=['👻 双轨对比(已录赛果'+tt+'场): 主轨v6.1命中'+Math.round(tt?mh/tt*100:0)+'% | 影轨v4.8.1命中'+Math.round(tt?lh/tt*100:0)+'%'];

 if(vecs.length>=20){

   py.runPython(ENGINE_PY);
   py.globals.set('__sample_pts',vecs);

   py.runPython('__rk=rebuild_protos()');

   lines2.push('🧬 '+msg);
  }catch(e){lines2.push('🧬 重构失败: '+escapeHtml(e.message||String(e)))}
 }
 window.FOOT_STATE.lastEvolve=new Date().toLocaleDateString();
 saveFS();
 out.textContent=out.textContent+String.fromCharCode(10)+lines2.join(String.fromCharCode(10))+String.fromCharCode(10)+'✅ 今日自动升级完成 ('+window.FOOT_STATE.lastEvolve+')';
}
