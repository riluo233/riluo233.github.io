<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#111"><title>DS+</title><script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script><style>
*{margin:0;padding:0;box-sizing:border-box}body{height:100vh;overflow:hidden;background:#111;color:#eee;font-family:sans-serif;-webkit-tap-highlight-color:transparent}#app{height:100%;display:flex;flex-direction:column;max-width:700px;margin:0 auto}
#hdr{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#1a1a1a;border-bottom:1px solid #333;flex-shrink:0}.hbtn{width:34px;height:34px;border-radius:50%;border:1px solid #333;background:#252525;color:#aaa;display:flex;align-items:center;justify-content:center;cursor:pointer}.hbtn.on{background:#8b5cf6;color:#fff}
#chat{flex:1;overflow-y:auto;padding:10px;-webkit-overflow-scrolling:touch}.msg{display:flex;margin-bottom:12px;gap:6px}.msg.u{flex-direction:row-reverse}.av{width:28px;height:28px;border-radius:50%;background:#252525;display:flex;align-items:center;justify-content:center;font-size:.8rem;flex-shrink:0}.bub{max-width:85%;padding:8px 12px;border-radius:12px;font-size:.9rem;line-height:1.5;word-break:break-word}.msg.u .bub{background:#1e3a2f}.msg.a .bub{background:#1a1a1a;border:1px solid #333}
.cw{margin:6px 0;border-radius:8px;overflow:hidden;border:1px solid #333}.ch{display:flex;justify-content:space-between;padding:4px 8px;background:#252525;font-size:.65rem;color:#999}.cb{padding:2px 8px;border-radius:4px;border:none;font-size:.65rem;cursor:pointer}.cb.r{background:#4ade80;color:#000}.cb.c{background:#1a1a1a;color:#999}.cw pre{margin:0;padding:8px;background:#0d1117;overflow-x:auto}.cw pre code{font-family:monospace;font-size:.72rem;white-space:pre-wrap}
.er{margin-top:-1px;padding:6px 10px;background:#0d1117;border-top:1px solid #333;font-size:.72rem;font-family:monospace;white-space:pre-wrap}.er.e{color:#ef4444}.er img{max-width:100%;border-radius:4px;margin-top:4px}.er table{width:100%;border-collapse:collapse;font-size:.7rem}.er td,.er th{border:1px solid #333;padding:4px 6px}.er th{background:#252525;color:#4ade80}.er .mermaid{background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:10px;margin:6px 0}.svbtn{display:inline-block;margin:4px 6px 6px 0;padding:5px 10px;background:#252525;color:#4ade80;border:1px solid #4ade80;border-radius:6px;font-size:.7rem;text-decoration:none}
#inp{display:flex;gap:6px;padding:6px;background:#1a1a1a;border-top:1px solid #333}#inp textarea{flex:1;background:#252525;border:1px solid #333;border-radius:10px;padding:8px;color:#eee;font-size:.85rem;resize:none;max-height:100px;min-height:38px;outline:none}#inp textarea:focus{border-color:#4ade80}#send{width:38px;height:38px;border-radius:50%;background:#4ade80;color:#000;border:none;font-size:1rem}#stop{width:38px;height:38px;border-radius:50%;background:#ef4444;color:#fff;border:none;display:none}
#mo{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;z-index:100}#mb{background:#1a1a1a;border-radius:16px 16px 0 0;padding:14px;width:100%;max-width:480px}#mb h3{font-size:1rem;margin-bottom:8px}#mb label{font-size:.7rem;color:#999;display:block;margin:8px 0 2px}#mb input,#mb select{width:100%;padding:8px;background:#252525;border:1px solid #333;border-radius:6px;color:#eee;font-size:.8rem;outline:none}.ma{display:flex;gap:6px;margin-top:10px}.btn{flex:1;padding:10px;border-radius:6px;border:none;font-weight:600;cursor:pointer}.btn.p{background:#4ade80;color:#000}.btn.s{background:#252525;color:#eee}.btn.d{background:#252525;color:#ef4444;border:1px solid #333;margin-top:10px;display:block;width:100%;padding:10px;border-radius:6px}
.tt{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#4ade80;color:#000;padding:6px 14px;border-radius:16px;font-size:.75rem;z-index:200}
</style></head><body><div id="app">
<div id="hdr"><b>🧠 DS+</b><div style="display:flex;gap:6px"><button class="hbtn" id="srch">🔍</button><button class="hbtn" id="nbtn">✨</button><button class="hbtn" id="sbtn">⚙️</button></div></div>
<div id="chat"><div style="text-align:center;color:#999;padding:40px 20px"><h2 style="color:#eee">DeepSeek+</h2><p style="font-size:.8rem">聊天 · Python · 搜索 · 图表 · 表格 · 流程图</p></div></div>
<div id="inp"><textarea id="ui" rows="1" placeholder="输入消息..."></textarea><button id="send">↑</button><button id="stop">■</button></div></div>
<div id="mo"><div id="mb"><h3>⚙️ 设置</h3><label>DeepSeek Key</label><input type="password" id="sk_ds"><label>DeepSeek URL</label><input id="su_ds" placeholder="https://api.deepseek.com"><label>模型</label><select id="sm"><option value="deepseek-v4-pro">V4-Pro</option><option value="deepseek-v4-flash">V4-Flash</option></select><label>ChatboxAI Key</label><input type="password" id="sk_cb"><label>ChatboxAI URL</label><input id="su_cb" placeholder="https://ai.chatboxai.app/v1"><div class="ma"><button class="btn s" id="mc">取消</button><button class="btn p" id="ms">保存</button></div><button class="btn d" id="clr">🗑️ 清空</button></div></div>
<script>
var akDS=localStorage.getItem('dsk')||'',buDS=localStorage.getItem('dsu')||'https://api.deepseek.com',mdl=localStorage.getItem('dsm')||'deepseek-v4-pro';
var akCB=localStorage.getItem('cbk')||'',buCB=localStorage.getItem('cbu')||'https://ai.chatboxai.app/v1';
var msgs=JSON.parse(localStorage.getItem('dsmsg')||'[]'),busy=false,sf=false,srchOn=false;
var py=null,pyOk=false,pyBusy=false;
var chat=document.getElementById('chat'),inp=document.getElementById('ui');
var snd=document.getElementById('send'),stp=document.getElementById('stop');
var mod=document.getElementById('mo'),pst=document.getElementById('pst');
var PRELOAD=['numpy','pandas','matplotlib','scipy','scikit-learn','pillow'];
var FONT_SETUP='import matplotlib\nmatplotlib.use("Agg")\nimport matplotlib.pyplot as plt\nimport matplotlib.font_manager as fm\nimport os\n_fp="/tmp/SimHei.ttf"\nif not os.path.exists(_fp):\n import pyodide.http\n try:\n  _r=await pyodide.http.pyfetch("https://cdn.jsdelivr.net/gh/StellarCN/scp_zh@master/fonts/SimHei.ttf")\n  _d=await _r.bytes()\n  open(_fp,"wb").write(_d)\n  fm.fontManager.addfont(_fp)\n except Exception:\n  pass\nelse:\n try: fm.fontManager.addfont(_fp)\n except Exception: pass\nplt.rcParams["font.sans-serif"]=["SimHei","sans-serif"]\nplt.rcParams["axes.unicode_minus"]=False';

function save(){localStorage.setItem('dsmsg',JSON.stringify(msgs));}
function scb(){chat.scrollTop=chat.scrollHeight;}
function tst(t){var d=document.createElement('div');d.className='tt';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove();},2200);}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function md(t){
  t=t.replace(/```(\w*)\n([\s\S]*?)```/g,function(_,l,c){var ip=l==='python'||l==='py';return '<div class="cw"><div class="ch"><span>'+(l||'code')+'</span><div style="display:flex;gap:3px"><button class="cb c" onclick="copyCode(this)">📋</button>'+(ip?'<button class="cb r" onclick="runCode(this)">▶ 运行</button>':'')+'</div></div><pre><code>'+esc(c.trim())+'</code></pre></div>';});
  t=t.replace(/`([^`]+)`/g,'<code style="background:#0d1117;padding:2px 5px;border-radius:4px;font-size:.8rem">$1</code>');
  t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  var p=t.split('\n\n');return p.map(function(x){if(x.indexOf('<div class="cw">')===0)return x;return '<p style="margin-bottom:5px">'+x.replace(/\n/g,'<br>')+'</p>';}).join('');
}
function render(){
  if(msgs.length===0){chat.innerHTML='<div style="text-align:center;color:#999;padding:40px 20px"><h2 style="color:#eee">DeepSeek+</h2><p style="font-size:.8rem">聊天 · Python · 搜索 · 图表 · 表格 · 流程图</p></div>';return;}
  chat.innerHTML='';msgs.forEach(function(m){if(m.role==='system')return;var r=document.createElement('div');r.className='msg '+(m.role==='user'?'u':'a');r.innerHTML='<div class="av">'+(m.role==='user'?'👤':'🧠')+'</div><div class="bub">'+md(m.content)+'</div>';chat.appendChild(r);});scb();
}
function upd(m){var b=chat.querySelectorAll('.msg.a .bub'),l=b[b.length-1];if(l)l.innerHTML=md(m.content);scb();}
window.copyCode=function(btn){var c=btn.closest('.cw').querySelector('code').innerText;navigator.clipboard.writeText(c).then(function(){btn.textContent='✅';setTimeout(function(){btn.textContent='📋';},1800);});};
window.runCode=function(btn){
  var w=btn.closest('.cw'),c=w.querySelector('code').innerText,o=w.querySelector('.er');if(o)o.remove();
  if(pyBusy){tst('Python加载中...');return;}btn.disabled=true;btn.textContent='⏳';runPy(c,btn,w);
};
function runPy(code,btn,w){
  function go(){
    var out='';btn.textContent='⏳ 准备...';
    Promise.all(PRELOAD.map(function(p){return py.loadPackage(p).catch(function(){});})).then(function(){
      py.runPythonAsync(FONT_SETUP).then(function(){
    btn.textContent='⚡ 执行...';
    try{
      py.runPython('import sys\nfrom io import StringIO\n_so=StringIO()\nsys.stdout=_so\nsys.stderr=_so');
      var ic=code.includes('plt.')||code.includes('matplotlib');
      if(ic)code+='\n_ds_imgs=[]\nimport io,base64\ntry:\n import matplotlib.pyplot as __plt\n for __fi in __plt.get_fignums():\n  __plt.figure(__fi)\n  __b=io.BytesIO()\n  __plt.savefig(__b,format="png",dpi=100,bbox_inches="tight")\n  __b.seek(0)\n  _ds_imgs.append(base64.b64encode(__b.read()).decode())\nexcept: pass\n';
      py.runPythonAsync(code).then(function(){
        try{out=py.runPython('_so.getvalue()');}catch(e){}
        var im=[];if(ic){try{var pi=py.runPython('_ds_imgs');if(pi&&pi.toJs)im=pi.toJs();else if(Array.isArray(pi))im=pi;}catch(e){}}
        var im2=[];
        if(out.indexOf('IMG_')>-1){
          var parts=out.split(/_{2,3}IMG_{2,3}/);
          for(var i=1;i<parts.length;i++){
            var cl=parts[i].replace(/\s/g,'');
            if(cl.length>100)im2.push(cl);
          }
          out=parts[0];
        }
        out=out.replace(/_ds_imgs[\s\S]*$/,'').trim();
        var allImgs=im.concat(im2);
        showRes(w,out||'(执行成功)',false,allImgs);btn.disabled=false;btn.textContent='▶ 运行';
      }).catch(function(e){showRes(w,out+'\n\n❌ '+e.message,true);btn.disabled=false;btn.textContent='▶ 运行';});
    }catch(e){showRes(w,'❌ '+e.message,true);btn.disabled=false;btn.textContent='▶ 运行';}
      }).catch(function(e){btn.disabled=false;btn.textContent='▶ 运行';showRes(w,'❌ 字体加载失败',true);});
    });
  }
  if(pyOk){go();return;}
  if(pyBusy)return;pyBusy=true;tst('首次加载Python (~50MB)...');
  var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/pyodide@0.25.0/pyodide.js';
  s.onload=function(){
    loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.25.0/full/'}).then(function(p){py=p;pyOk=true;pyBusy=false;go();}).catch(function(e){pyBusy=false;showRes(w,'❌ 加载失败',true);btn.disabled=false;btn.textContent='▶ 运行';});
  };s.onerror=function(){pyBusy=false;showRes(w,'❌ 网络错误',true);btn.disabled=false;btn.textContent='▶ 运行';};document.head.appendChild(s);
}
function showRes(w,t,er,im){
  var d=document.createElement('div');d.className='er'+(er?' e':'');
  d.innerHTML='<div style="font-size:.7rem;color:'+(er?'#ef4444':'#4ade80')+';margin-bottom:4px">'+(er?'❌ 出错':'✅ 成功')+'</div>';
  if(t&&t.indexOf('___TABLE___')>-1){
    var tp=t.split('___TABLE___');
    t=tp[0].trim();
    var csv=tp[1].replace(/^\s+|\s+$/g,'');
    var rows=csv.split('\n').map(function(r){return r.split(',');});
    if(rows.length>0){
      var tb=document.createElement('table');
      rows.forEach(function(r,ri){
        var tr=document.createElement('tr');
        r.forEach(function(cell){
          var c=document.createElement(ri===0?'th':'td');
          c.textContent=cell.trim();
          tr.appendChild(c);
        });
        tb.appendChild(tr);
      });
      d.appendChild(tb);
      var a=document.createElement('a');
      a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
      a.download='data.csv';a.textContent='💾 保存CSV';a.className='svbtn';d.appendChild(a);
    }
  }
  if(t&&t.indexOf('___MERMAID___')>-1){
    var mp=t.split('___MERMAID___');
    t=mp[0].trim();
    var code=mp[1].trim();
    var dv=document.createElement('div');
    dv.className='mermaid';dv.textContent=code;d.appendChild(dv);
    try{
      mermaid.initialize({startOnLoad:false,theme:'dark'});
      mermaid.run({nodes:[dv]}).catch(function(){});
    }catch(e){}
    var sb=document.createElement('a');
    sb.href='data:text/plain;charset=utf-8,'+encodeURIComponent(code);
    sb.download='flowchart.mmd';sb.textContent='💾 保存流程图源码';sb.className='svbtn';d.appendChild(sb);
  }
  if(t){var p=document.createElement('pre');p.textContent=t;p.style.cssText='margin:0;white-space:pre-wrap';d.appendChild(p);}
  if(im&&im.length>0)im.forEach(function(b,idx){
    var i=document.createElement('img');i.src='data:image/png;base64,'+b;i.style.cssText='max-width:100%;border-radius:4px;margin-top:4px;display:block';d.appendChild(i);
    var a=document.createElement('a');a.href='data:image/png;base64,'+b;a.download='chart_'+(idx+1)+'.png';a.textContent='💾 保存图'+(idx+1);a.className='svbtn';d.appendChild(a);
  });
  w.appendChild(d);scb();
}
function callAPI(ak,bu,mdl2,mArr,str,cb){
  var u=bu.replace(/\/$/,'')+'/chat/completions';
  if(bu.indexOf('chatboxai')>-1)u='https://corsproxy.io/?'+encodeURIComponent(u);
  fetch(u,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+ak},body:JSON.stringify({model:mdl2,messages:mArr,stream:str,temperature:0.7})})
  .then(function(r){
    if(!r.ok)return r.text().then(function(t){cb('❌ '+r.status,null);});
    if(!str)return r.json().then(function(j){cb(null,j.choices[0].message.content);});
    var rd=r.body.getReader(),dc=new TextDecoder(),bf='',full='';
    function pump(){rd.read().then(function(x){if(x.done){cb(null,full);return;}bf+=dc.decode(x.value,{stream:true});var ls=bf.split('\n');bf=ls.pop()||'';ls.forEach(function(l){if(!l.startsWith('data: '))return;var d=l.slice(6).trim();if(d==='[DONE]')return;try{var j=JSON.parse(d),dt=(j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content)||'';if(dt)full+=dt;}catch(e){}});if(sf){cb(null,full);return;}pump();}).catch(function(){cb(null,full);});}pump();
  }).catch(function(e){cb('❌ 网络:'+e.message,null);});
}
var SP='你是DeepSeek。需要实时数据时输出 [SEARCH:关键词]，系统自动搜索后返回结果。收到结果后继续回答。不需要搜索就直接回答。';
function doSearch(q,cb){
  if(!akCB){cb(null,'搜索未配置，请填ChatboxAI Key');return;}
  callAPI(akCB,buCB,'gemini-3-pro',[{role:'user',content:'搜索并返回详细信息：'+q}],false,cb);
}
function sendSrch(txt){
  msgs.push({role:'assistant',content:'🔍 分析...'});render();var ai=msgs.length-1;
  callAPI(akDS,buDS,mdl,[{role:'system',content:SP},{role:'user',content:txt}],false,function(err,re){
    if(err){msgs[ai].content=err;render();save();fin();return;}
    var sm=re.match(/\[SEARCH:\s*([^\]]+)\]/);
    if(sm){
      var sq=sm[1].trim();msgs[ai].content='🔍 搜索中：'+sq;render();
      doSearch(sq,function(se,sr){
        if(se){msgs[ai].content=se;render();save();fin();return;}
        msgs[ai].content='';render();
        callAPI(akDS,buDS,mdl,[{role:'system',content:SP},{role:'user',content:txt},{role:'user',content:'搜索结果：\n'+sr+'\n请据此回答。'}],true,function(fe,fr){
          if(fe)msgs[ai].content=fe;else msgs[ai].content=fr||'(空)';
          render();save();fin();
        });
      });
    }else{msgs[ai].content=re||'(空)';render();save();fin();}
  });
}
function fin(){busy=false;snd.style.display='flex';stp.style.display='none';}
function send(){
  var t=inp.value.trim();if(!t||busy)return;
  if(!akDS){tst('请先设置Key ⚙️');openMod();return;}
  if(msgs.length===0)chat.innerHTML='';
  msgs.push({role:'user',content:t});save();render();inp.value='';inp.style.height='auto';
  busy=true;sf=false;snd.style.display='none';stp.style.display='flex';
  if(srchOn){sendSrch(t);return;}
  msgs.push({role:'assistant',content:''});render();var ai=msgs.length-1;
  callAPI(akDS,buDS,mdl,msgs.filter(function(m){return m.role!=='system';}),true,function(e,f){if(e)msgs[ai].content=e;else msgs[ai].content=f||'(空)';render();save();fin();});
}
function stopGen(){sf=true;}
document.getElementById('srch').addEventListener('click',function(){
  srchOn=!srchOn;var b=document.getElementById('srch');
  if(srchOn){b.classList.add('on');tst('🔍 自动搜索 ON');}else{b.classList.remove('on');tst('💬 普通模式');}
});
function openMod(){document.getElementById('sk_ds').value=akDS;document.getElementById('su_ds').value=buDS;document.getElementById('sk_cb').value=akCB;document.getElementById('su_cb').value=buCB;document.getElementById('sm').value=mdl;mod.style.display='flex';}
function closeMod(){mod.style.display='none';}
document.getElementById('ms').addEventListener('click',function(){
  akDS=document.getElementById('sk_ds').value.trim();buDS=document.getElementById('su_ds').value.trim()||'https://api.deepseek.com';
  akCB=document.getElementById('sk_cb').value.trim();buCB=document.getElementById('su_cb').value.trim()||'https://ai.chatboxai.app/v1';
  mdl=document.getElementById('sm').value;
  localStorage.setItem('dsk',akDS);localStorage.setItem('dsu',buDS);localStorage.setItem('cbk',akCB);localStorage.setItem('cbu',buCB);localStorage.setItem('dsm',mdl);
  closeMod();tst('✅ 已保存');
});
document.getElementById('mc').addEventListener('click',closeMod);
mod.addEventListener('click',function(e){if(e.target===mod)closeMod();});
document.getElementById('clr').addEventListener('click',function(){if(confirm('清空？')){msgs=[];save();render();closeMod();tst('🗑️ 已清空');}});
document.getElementById('sbtn').addEventListener('click',openMod);
document.getElementById('nbtn').addEventListener('click',function(){if(msgs.length>0&&!confirm('新对话？'))return;msgs=[];save();render();tst('✨ 新对话');});
snd.addEventListener('click',send);stp.addEventListener('click',stopGen);
inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
inp.addEventListener('input',function(){inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,100)+'px';});
render();
</script></body></html>
