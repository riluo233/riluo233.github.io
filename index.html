let CODES=[];
function extractCodeBlocks(text){CODES=[];return text.replace(/```python\n?([\s\S]*?)```/g,(m,c)=>{CODES.push(c);return '\n[[CODE:'+(CODES.length-1)+']]\n'})}
function splitMarkers(text){
 const parts=[];let cur='';const re=/(___HTML___\n|___TABLE___\n|___MERMAID___\n|___IMG___\n)/g;
 let m,last=0;
 while((m=re.exec(text))){
  if(m.index>last)cur+=text.slice(last,m.index);
  if(cur.trim()){parts.push({type:'text',content:cur});cur=''}
  const s=m.index+m[0].length;
  const e=text.indexOf('___',s);
  const c=(e===-1)?text.slice(s):text.slice(s,e);
  parts.push({type:m[1].replace(/\n/,'').replace(/^___|___$/g,'').toLowerCase(),content:c});
  if(e===-1){last=text.length;break}
  last=e;
 }
 if(last<text.length){cur+=text.slice(last);if(cur.trim())parts.push({type:'text',content:cur})}
 return parts;
}
function renderTable(csv,wrap){
 const t=document.createElement('table');t.className='tbl';
 csv.trim().split('\n').forEach((r,i)=>{const tr=document.createElement('tr');r.split(',').forEach(c=>{const cell=document.createElement(i===0?'th':'td');cell.textContent=c;tr.appendChild(cell)});t.appendChild(tr)});
 wrap.appendChild(t);
 const b=document.createElement('button');b.textContent='💾保存CSV';b.style.cssText='margin-top:6px';
 b.onclick=()=>downloadFile('表格_'+Date.now()+'.csv',csv,'text/csv;charset=utf-8');
 wrap.appendChild(b);
}
function renderMermaid(code,wrap){
 const body=code.trim();
 const b64=btoa(unescape(encodeURIComponent(body)));
 const img=document.createElement('img');
 img.src='https://mermaid.ink/img/base64:'+b64;
 img.style.cssText='max-width:100%;background:#fff;border-radius:8px';
 img.onerror=()=>{img.outerHTML='<div style="color:#ff9090;font-size:13px">流程图渲染失败，可保存.mmd后用mermaid.live查看</div>'};
 wrap.appendChild(img);

 const b1=document.createElement('button');b1.textContent='💾.mmd';b1.onclick=()=>downloadFile('流程图_'+Date.now()+'.mmd',body);
 const b2=document.createElement('button');b2.textContent='🖼️PNG';b2.onclick=()=>window.open('https://mermaid.ink/img/base64:'+b64,'_blank');

 const b4=document.createElement('button');b4.textContent='✏️编辑';b4.onclick=()=>window.open('https://mermaid.live/edit?raw='+encodeURIComponent(body),'_blank');
 [b1,b2,b3,b4].forEach(b=>bar.appendChild(b));
 wrap.appendChild(bar);
}
function showRes(text,box){
 if(!box)box=addMsg('ai','');
 box.innerHTML='';
 splitMarkers(text).forEach(s=>{
  if(s.type==='text'){
   const d=document.createElement('div');
   let t=escapeHtml(s.content).replace(/\[\[CODE:(\d+)\]\]/g,(mm,i)=>{const code=CODES[+i];return '<div class="out-item"><div style="font-size:11px;color:#8fa3bf;margin-bottom:4px">🐍 Python</div><pre class="code">'+escapeHtml(code.length>400?code.slice(0,400)+'…':code)+'</pre><button data-run="'+i+'" style="margin-top:6px">▶运行</button><span class="runStatus" style="font-size:12px;color:#8fa3bf;margin-left:8px"></span></div>'});
   d.innerHTML=t.replace(/\n/g,'<br>');
   box.appendChild(d);
  }else if(s.type==='html'){const d=document.createElement('div');d.className='out-item';d.innerHTML=s.content;box.appendChild(d)}
  else if(s.type==='table'){const d=document.createElement('div');d.className='out-item';renderTable(s.content,d);box.appendChild(d)}
  else if(s.type==='mermaid'){const d=document.createElement('div');d.className='out-item';renderMermaid(s.content,d);box.appendChild(d)}
  else if(s.type==='img'){
   const d=document.createElement('div');d.className='out-item';const b64=s.content.trim().replace(/\s/g,'');
   d.innerHTML='<img src="data:image/png;base64,'+b64+'" style="max-width:100%;border-radius:8px"><div style="margin-top:6px"><button onclick="saveDataUrl(\'图表_'+Date.now()+'.png\',\'data:image/png;base64,'+b64+'\')">💾保存PNG</button></div>';
   box.appendChild(d);
  }
 });
 box.querySelectorAll('[data-run]').forEach(b=>{b.onclick=()=>runCode(CODES[+b.dataset.run],b.nextElementSibling,b)});
 if(AUTO_EXEC)setTimeout(()=>box.querySelectorAll('[data-run]').forEach(b=>b.click()),100);
 scrollBox();
}

function buildMessages(uc){

async function send(){
 const inp=$('chatInput');const q=inp.value.trim();if(!q)return;
 inp.value='';
 addMsg('user',q);
 HISTORY.push({role:'user',content:q});
 const box=addMsg('ai','');
 let full='';
 try{
  let uc=q;
  if(shouldSearch(q)){
   if(!TAVILY_KEY)uc+='\n\n(提示：未配置Tavily Key，直接根据知识回答)';
   else{box.firstChild.textContent='🔍 正在搜索…';const info=await tavilySearch(q);if(info)uc+='\n\n'+info}
  }
  const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY},body:JSON.stringify({model:MODEL,messages:buildMessages(uc),stream:true})});
  if(!res.ok){let m='HTTP '+res.status;try{const j=await res.json();m=(j&&j.error&&j.error.message)||m}catch(e){}throw new Error(m)}
  const rd=res.body.getReader(),dec=new TextDecoder();let buf='',last=0;
  while(true){
   const {done,value}=await rd.read();if(done)break;
   buf+=dec.decode(value,{stream:true});
   const lines=buf.split('\n');buf=lines.pop();
   for(const l of lines){
    const t=l.trim();if(!t.startsWith('data:'))continue;
    const d=t.slice(5).trim();if(d==='[DONE]')continue;
    try{const j=JSON.parse(d);full+=(j.choices[0].delta&&j.choices[0].delta.content)||''}catch(e){}
   }
   const now=Date.now();if(now-last>80){last=now;box.firstChild.textContent=full;scrollBox()}
  }
  if(!full)throw new Error('AI返回为空');
 }catch(e){full='⚠️ '+(e.message||'网络错误')}
 finalizeReply(full,box);
}
function finalizeReply(full,box){
 full=extractCodeBlocks(full);
 full=applyAiPipeline(full);
 box.firstChild.textContent='';
 showRes(full,box);
 showAllSaveBar();
 setTimeout(flushEcharts,300);
 saveMemory(full);
}
function saveMemory(full){
 const plain=full.replace(/___\w+___/g,'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').slice(0,200);
 if(plain){SUMMARY=(SUMMARY?SUMMARY+'\n':'')+plain;if(SUMMARY.length>2000)SUMMARY=SUMMARY.slice(-2000);localStorage.setItem('wt_summary',SUMMARY)}
 HISTORY.push({role:'assistant',content:full});
 if(HISTORY.length>40)HISTORY=HISTORY.slice(-40);
}
