<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111">
<title>DeepSeek+</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;overflow:hidden;background:#111;color:#eee;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;max-width:700px;margin:0 auto}
#hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#1a1a1a;border-bottom:1px solid #333;flex-shrink:0;z-index:10}
#hdr b{font-size:1rem}
#hdr div{display:flex;gap:8px}
.hbtn{width:36px;height:36px;border-radius:50%;border:1px solid #333;background:#252525;color:#aaa;font-size:1rem;display:flex;align-items:center;justify-content:center;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.msg{display:flex;margin-bottom:14px;gap:6px}
.msg.u{flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;background:#252525;flex-shrink:0}
.bub{max-width:82%;padding:10px 14px;border-radius:14px;font-size:.9rem;line-height:1.5;word-break:break-word}
.msg.u .bub{background:#1e3a2f;border-bottom-right-radius:3px}
.msg.a .bub{background:#1a1a1a;border:1px solid #333;border-bottom-left-radius:3px}
.cw{margin:8px 0;border-radius:10px;overflow:hidden;border:1px solid #333}
.ch{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;background:#252525;font-size:.65rem;color:#999}
.cb{padding:3px 8px;border-radius:5px;border:none;font-size:.65rem;cursor:pointer;font-weight:600}
.cb.r{background:#4ade80;color:#000}
.cb.c{background:#1a1a1a;color:#999;border:1px solid #333}
.cw pre{margin:0;padding:10px;background:#0d1117;overflow-x:auto}
.cw pre code{font-family:monospace;font-size:.75rem;color:#c9d1d9;white-space:pre-wrap}
.er{margin-top:-1px;padding:8px 12px;background:#0d1117;border-top:1px solid #333;font-size:.75rem;max-height:300px;overflow-y:auto;font-family:monospace;white-space:pre-wrap;color:#c9d1d9}
.er.e{color:#ef4444;border-top-color:#ef4444}
.er img{max-width:100%;border-radius:6px;margin-top:6px}
.ld{display:inline-flex;gap:4px}
.ld span{width:5px;height:5px;border-radius:50%;background:#999;animation:d 1.4s infinite}
.ld span:nth-child(2){animation-delay:.2s}
.ld span:nth-child(3){animation-delay:.4s}
@keyframes d{0%,60%,100%{opacity:.3}30%{opacity:1}}
#ps{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#252525;border:1px solid #4ade80;padding:8px 16px;border-radius:20px;font-size:.75rem;display:flex;align-items:center;gap:6px;z-index:20}
#ps.h{display:none}
#inp{padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));background:#1a1a1a;border-top:1px solid #333;display:flex;gap:6px;align-items:flex-end;flex-shrink:0}
#inp textarea{flex:1;background:#252525;border:1px solid #333;border-radius:12px;padding:10px 12px;color:#eee;font-size:.88rem;font-family:inherit;resize:none;max-height:110px;min-height:40px;outline:none;line-height:1.3}
#inp textarea:focus{border-color:#4ade80}
#send{width:40px;height:40px;border-radius:50%;background:#4ade80;color:#000;border:none;font-size:1.1rem;cursor:pointer;flex-shrink:0}
#stop{width:40px;height:40px;border-radius:50%;background:#ef4444;color:#fff;border:none;font-size:.8rem;cursor:pointer;flex-shrink:0;display:none}
#mo{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:100}
#mb{background:#1a1a1a;border-radius:18px 18px 0 0;padding:18px 14px calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-width:480px}
#mb h3{font-size:1rem;margin-bottom:12px}
#mb label{font-size:.75rem;color:#999;display:block;margin:10px 0 3px}
#mb input,#mb select{width:100%;padding:10px;background:#252525;border:1px solid #333;border-radius:8px;color:#eee;font-size:.85rem;outline:none}
#mb input:focus{border-color:#4ade80}
.ma{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;padding:11px;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;border:none;text-align:center}
.btn.p{background:#4ade80;color:#000}
.btn.s{background:#252525;color:#eee;border:1px solid #333}
.btn.d{background:#252525;color:#ef4444;border:1px solid #333;margin-top:14px;display:block;width:100%}
.wc{text-align:center;padding:40px 20px;color:#999}
.wc .ic{font-size:3rem;margin-bottom:8px}
.wc h2{color:#eee;margin-bottom:4px}
.wc p{font-size:.82rem;line-height:1.5}
.tt{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#4ade80;color:#000;padding:8px 18px;border-radius:20px;font-size:.78rem;font-weight:600;z-index:200}
</style>
</head>
<body>
<div id="app">
<div id="hdr"><b>🧠 DeepSeek+</b><div><button class="hbtn" id="nbtn">✨</button><button class="hbtn" id="sbtn">⚙️</button></div></div>
<div id="chat"><div class="wc"><div class="ic">🧠</div><h2>DeepSeek V4-Pro</h2><p>聊天 · Python执行 · 足球推演<br>点击 ⚙️ 设置 API Key 开始</p></div></div>
<div id="ps" class="h"><div class="ld"><span></span><span></span><span></span></div><span id="pst">加载 Python...</span></div>
<div id="inp"><textarea id="ui" rows="1" placeholder="输入消息..."></textarea><button id="send">↑</button><button id="stop">■</button></div>
</div>
<div id="mo"><div id="mb"><h3>⚙️ 设置</h3><label>DeepSeek API Key</label><input type="password" id="sk" placeholder="sk-xxxx..."><label>DeepSeek Base URL</label><input id="su" placeholder="https://api.deepseek.com"><label>模型</label><select id="sm"><option value="deepseek-v4-pro">DeepSeek V4-Pro</option><option value="deepseek-v4-flash">DeepSeek V4-Flash</option></select><div class="ma"><button class="btn s" id="mc">取消</button><button class="btn p" id="ms">保存</button></div><button class="btn d" id="clr">🗑️ 清空聊天</button></div></div>
<script>
var apiKey=localStorage.getItem('dsk')||'';
var baseUrl=localStorage.getItem('dsu')||'https://api.deepseek.com';
var model=localStorage.getItem('dsm')||'deepseek-v4-pro';
var messages=JSON.parse(localStorage.getItem('dsmsg')||'[]');
var busy=false,stopFlag=false;
var pyodide=null,pyReady=false,pyLoading=false;
var chatEl=document.getElementById('chat');
var inpEl=document.getElementById('ui');
var sendBtn=document.getElementById('send');
var stopBtn=document.getElementById('stop');
var modalEl=document.getElementById('mo');
var psEl=document.getElementById('ps');
var pstEl=document.getElementById('pst');

function save(){localStorage.setItem('dsmsg',JSON.stringify(messages));}
function scrollBottom(){chatEl.scrollTop=chatEl.scrollHeight;}
function toast(t){var d=document.createElement('div');d.className='tt';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove();},2200);}
function escHTML(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function md2html(t){
  t=t.replace(/```(\w*)\n([\s\S]*?)```/g,function(_,lang,code){var isPy=lang==='python'||lang==='py';return '<div class="cw"><div class="ch"><span>'+(lang||'code')+'</span><div style="display:flex;gap:3px"><button class="cb c" onclick="copyCode(this)">📋</button>'+(isPy?'<button class="cb r" onclick="runCode(this)">▶ 运行</button>':'')+'</div></div><pre><code>'+escHTML(code.trim())+'</code></pre></div>';});
  t=t.replace(/`([^`]+)`/g,'<code style="background:#0d1117;padding:2px 5px;border-radius:4px;font-size:.8rem">$1</code>');
  t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  var ps=t.split('\n\n');
  return ps.map(function(p){if(p.indexOf('<div class="cw">')===0)return p;return '<p style="margin-bottom:5px">'+p.replace(/\n/g,'<br>')+'</p>';}).join('');
}
function render(){
  if(messages.length===0){chatEl.innerHTML='<div class="wc"><div class="ic">🧠</div><h2>DeepSeek V4-Pro</h2><p>聊天 · Python执行 · 足球推演<br>点击 ⚙️ 设置 API Key 开始</p></div>';return;}
  chatEl.innerHTML='';
  messages.forEach(function(m){if(m.role==='system')return;var row=document.createElement('div');row.className='msg '+(m.role==='user'?'u':'a');row.innerHTML='<div class="av">'+(m.role==='user'?'👤':'🧠')+'</div><div class="bub">'+md2html(m.content)+'</div>';chatEl.appendChild(row);});
  scrollBottom();
}
function updateLast(msg){var bubbles=chatEl.querySelectorAll('.msg.a .bub');var last=bubbles[bubbles.length-1];if(last)last.innerHTML=md2html(msg.content);scrollBottom();}
window.copyCode=function(btn){var code=btn.closest('.cw').querySelector('code').innerText;navigator.clipboard.writeText(code).then(function(){btn.textContent='✅';setTimeout(function(){btn.textContent='📋';},1800);});};
window.runCode=function(btn){
  var wrapper=btn.closest('.cw');var code=wrapper.querySelector('code').innerText;
  var old=wrapper.querySelector('.er');if(old)old.remove();
  if(pyLoading){toast('Python 加载中，请稍候');return;}
  btn.disabled=true;btn.textContent='⏳';loadPyodideAndRun(code,btn,wrapper);
};
function loadPyodideAndRun(code,btn,wrapper){
  function run(){
    var output='';btn.textContent='⚡';
    try{
      pyodide.runPython('import sys\nfrom io import StringIO\n_so=StringIO()\nsys.stdout=_so\nsys.stderr=_so');
      var isChart=code.includes('plt.')||code.includes('matplotlib');
      if(isChart){code+='\n_ds_imgs=[]\nimport io,base64\ntry:\n import matplotlib.pyplot as __plt\n for __fi in __plt.get_fignums():\n  __plt.figure(__fi)\n  __b=io.BytesIO()\n  __plt.savefig(__b,format="png",dpi=100,bbox_inches="tight")\n  __b.seek(0)\n  _ds_imgs.append(base64.b64encode(__b.read()).decode())\nexcept: pass\n';}
      var pkgs=[];var re=/(?:import\s+(\w+)|from\s+(\w+)\s+import)/g;var m;
      var map={numpy:'numpy',pandas:'pandas',matplotlib:'matplotlib',scipy:'scipy',sklearn:'scikit-learn'};
      while((m=re.exec(code))!==null){var p=map[m[1]||m[2]];if(p&&pkgs.indexOf(p)===-1)pkgs.push(p);}
      pyodide.runPythonAsync(code).then(function(){
        try{output=pyodide.runPython('_so.getvalue()');}catch(e){}
        var imgs=[];if(isChart){try{var pyImgs=pyodide.runPython('_ds_imgs');if(pyImgs&&pyImgs.toJs){imgs=pyImgs.toJs();}else if(Array.isArray(pyImgs)){imgs=pyImgs;}}catch(e){}}
        output=output.replace(/_ds_imgs[\s\S]*$/,'').trim();
        showExecResult(wrapper,output||'(执行成功)',imgs);
        btn.disabled=false;btn.textContent='▶ 运行';
      }).catch(function(err){showExecResult(wrapper,output.trim()+'\n\n❌ '+err.message,true);btn.disabled=false;btn.textContent='▶ 运行';});
    }catch(err){showExecResult(wrapper,'❌ '+err.message,true);btn.disabled=false;btn.textContent='▶ 运行';}
  }

  if(pyReady){run();return;}
  if(pyLoading)return;
  pyLoading=true;psEl.classList.remove('h');pstEl.textContent='加载 Python 环境... (首次约 20-30 秒)';
  var script=document.createElement('script');
  script.src='https://cdn.jsdelivr.net/npm/pyodide@0.25.0/pyodide.js';
  script.onload=function(){
    pstEl.textContent='加载 Python 核心... (~50MB)';
    loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.25.0/full/'}).then(function(py){
      pyodide=py;pyReady=true;pyLoading=false;psEl.classList.add('h');
      pyodide.loadPackage(['numpy','matplotlib']).catch(function(){});
      run();
    }).catch(function(err){pyLoading=false;psEl.classList.add('h');showExecResult(wrapper,'❌ 加载失败: '+err.message,true);btn.disabled=false;btn.textContent='▶ 运行';});
  };
  script.onerror=function(){pyLoading=false;psEl.classList.add('h');showExecResult(wrapper,'❌ 网络错误',true);btn.disabled=false;btn.textContent='▶ 运行';};
  document.head.appendChild(script);
}

function showExecResult(wrapper,text,isError,imgs){
  var div=document.createElement('div');div.className='er'+(isError?' e':'');
  div.innerHTML='<div style="font-size:.7rem;color:'+(isError?'#ef4444':'#4ade80')+';margin-bottom:4px">'+(isError?'❌ 出错':'✅ 成功')+'</div>';
  if(text){var pre=document.createElement('pre');pre.textContent=text;pre.style.cssText='margin:0;white-space:pre-wrap;font:inherit;';div.appendChild(pre);}
  if(imgs&&imgs.length>0){imgs.forEach(function(b64){var img=document.createElement('img');img.src='data:image/png;base64,'+b64;img.style.cssText='max-width:100%;border-radius:6px;margin-top:6px;display:block';div.appendChild(img);});}
  wrapper.appendChild(div);scrollBottom();
}

function send(){
  var text=inpEl.value.trim();if(!text||busy)return;
  if(!apiKey){toast('请先设置 API Key ⚙️');openModal();return;}
  if(messages.length===0)chatEl.innerHTML='';
  messages.push({role:'user',content:text});save();render();
  inpEl.value='';inpEl.style.height='auto';
  messages.push({role:'assistant',content:''});render();
  var aiIdx=messages.length-1;
  busy=true;stopFlag=false;sendBtn.style.display='none';stopBtn.style.display='flex';
  fetch(baseUrl.replace(/\/$/,'')+'/chat/completions',{
    method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
    body:JSON.stringify({model:model,messages:messages.filter(function(m){return m.role!=='system';}),stream:true,temperature:0.7})
  }).then(function(res){
    if(!res.ok)return res.text().then(function(t){throw new Error('API '+res.status+': '+t);});
    var reader=res.body.getReader();var decoder=new TextDecoder();var buf='';
    function pump(){reader.read().then(function(r){if(r.done){finish();return;}buf+=decoder.decode(r.value,{stream:true});var lines=buf.split('\n');buf=lines.pop()||'';lines.forEach(function(line){if(!line.startsWith('data: '))return;var d=line.slice(6).trim();if(d==='[DONE]')return;try{var j=JSON.parse(d);var delta=(j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content)||'';if(delta){messages[aiIdx].content+=delta;updateLast(messages[aiIdx]);}}catch(e){}});if(stopFlag){finish();return;}pump();}).catch(finish);}pump();
  }).catch(function(err){messages[aiIdx].content='❌ 错误: '+err.message;render();finish();});
  function finish(){busy=false;sendBtn.style.display='flex';stopBtn.style.display='none';save();}
}

function stopGen(){stopFlag=true;}
function openModal(){document.getElementById('sk').value=apiKey;document.getElementById('su').value=baseUrl;document.getElementById('sm').value=model;modalEl.style.display='flex';}
function closeModal(){modalEl.style.display='none';}
document.getElementById('ms').addEventListener('click',function(){apiKey=document.getElementById('sk').value.trim();baseUrl=document.getElementById('su').value.trim()||'https://api.deepseek.com';model=document.getElementById('sm').value;localStorage.setItem('dsk',apiKey);localStorage.setItem('dsu',baseUrl);localStorage.setItem('dsm',model);closeModal();toast('✅ 已保存');});
document.getElementById('mc').addEventListener('click',closeModal);
modalEl.addEventListener('click',function(e){if(e.target===modalEl)closeModal();});
document.getElementById('clr').addEventListener('click',function(){if(confirm('清空所有聊天记录？')){messages=[];save();render();closeModal();toast('🗑️ 已清空');}});
document.getElementById('sbtn').addEventListener('click',openModal);
document.getElementById('nbtn').addEventListener('click',function(){if(messages.length>0&&!confirm('开始新对话？'))return;messages=[];save();render();toast('✨ 新对话');});
sendBtn.addEventListener('click',send);stopBtn.addEventListener('click',stopGen);
inpEl.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
inpEl.addEventListener('input',function(){inpEl.style.height='auto';inpEl.style.height=Math.min(inpEl.scrollHeight,110)+'px';});
render();
</script>
</body>
</html>
